name: Signed desktop bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - name: Install signing identity and notarization key
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            if [ -z "${!name}" ]; then echo "Missing release secret: $name" >&2; exit 1; fi
          done
          cert="$RUNNER_TEMP/gitty-certificate.p12"
          keychain="$RUNNER_TEMP/gitty-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$cert"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build signed and notarized DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- build --bundles dmg
      - name: Verify signatures and notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/Gitty.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          shopt -s nullglob
          bundles=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#bundles[@]}" -gt 0
          for bundle in "${bundles[@]}"; do xcrun stapler validate "$bundle"; done
      - uses: actions/upload-artifact@v4
        with:
          name: gitty-macos-notarized
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - name: Import signing certificate and create Tauri release override
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Missing Windows code-signing secrets' }
          $pfx = Join-Path $env:RUNNER_TEMP 'gitty-certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (!$cert.Thumbprint) { throw 'No imported code-signing certificate' }
          $config = Join-Path $env:RUNNER_TEMP 'gitty-windows-signing.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 | Set-Content $config
          "GITTY_SIGN_CONFIG=$config" | Out-File $env:GITHUB_ENV -Append
      - name: Build signed Windows installers
        shell: pwsh
        env:
        run: npm run tauri -- build --config $env:GITTY_SIGN_CONFIG --bundles nsis,msi
      - name: Verify installer signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($files.Count -eq 0) { throw 'No installers produced' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($file.Name): $($signature.Status)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: gitty-windows-signed
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
