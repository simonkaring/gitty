[package]
name = "gitty-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
base64 = "0.22"
cap-std = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "8"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
