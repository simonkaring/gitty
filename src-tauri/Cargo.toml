[package]
name = "gitty"
default-run = "gitty"
version = "0.1.0"
description = "A considered, graph-first Git client"
authors = ["Gitty contributors"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "gitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitty-core = { path = "../crates/gitty-core" }
tauri = { version = "2", features = [] }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3"
